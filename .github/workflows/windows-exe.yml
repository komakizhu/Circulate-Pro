name: Build Windows VST3 EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows fork version (three-part semantic version)"
        required: true
        default: "3.0.0"
        type: string
  push:
    tags:
      - "v*-windows"

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-exe:
    runs-on: windows-2022
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version
        id: release
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } elseif ($env:REF_NAME -match '^v(.+)-windows$') { $Matches[1] } else { '3.0.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a three-part version such as 3.0.0, got: $version"
          }
          $fullVersion = "$version.0"
          $tag = if ($env:REF_NAME -match '^v\d+\.\d+\.\d+-windows$') { $env:REF_NAME } else { "v$version-windows" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "full_version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Building Circulate Windows $fullVersion"

      - name: Configure Windows VST3
        shell: pwsh
        env:
          FULL_VERSION: ${{ steps.release.outputs.full_version }}
        run: |
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCIRCULATE_VERSION="$env:FULL_VERSION" `
            -DSMTG_ENABLE_VSTGUI_SUPPORT=ON `
            -DSMTG_CREATE_PLUGIN_LINK=OFF `
            -DSMTG_CREATE_BUNDLE_FOR_WINDOWS=ON `
            -DSMTG_RUN_VST_VALIDATOR=OFF

      - name: Build Windows VST3
        shell: pwsh
        run: cmake --build build-windows --config Release --target Circulate -- /m:2

      - name: Validate Windows VST3 bundle
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE "build-windows\VST3\Release\Circulate.vst3"
          $binary = Join-Path $plugin "Contents\x86_64-win\Circulate.vst3"
          $resources = Join-Path $plugin "Contents\Resources"
          if (-not (Test-Path -LiteralPath $binary)) { throw "Missing Windows VST3 binary: $binary" }
          if (-not (Test-Path -LiteralPath (Join-Path $resources "editor.uidesc"))) { throw "Missing editor.uidesc" }
          if (-not (Test-Path -LiteralPath (Join-Path $plugin "Contents"))) { throw "Missing VST3 Contents directory" }
          Write-Host "Plugin bundle: $plugin"
          Get-ChildItem -LiteralPath $plugin -Recurse -File | Select-Object FullName, Length

      - name: Install NSIS
        shell: pwsh
        run: |
          $existing = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $existing) {
            choco install nsis --yes --no-progress
          }
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) { throw "makensis.exe is not available" }
          Write-Host "Using NSIS: $($makensis.Source)"

      - name: Build EXE installer
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FULL_VERSION: ${{ steps.release.outputs.full_version }}
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE "build-windows\VST3\Release\Circulate.vst3"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "outputs"
          $outFile = Join-Path $outDir "Circulate-Windows-VST3-Setup-$env:VERSION.exe"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $makensis = (Get-Command makensis.exe).Source
          & $makensis `
            "/DOUTFILE=$outFile" `
            "/DPLUGIN_STAGE=$plugin" `
            "/DPLUGIN_ICON=$(Join-Path $plugin 'PlugIn.ico')" `
            "/DLICENSE_FILE=$(Join-Path $env:GITHUB_WORKSPACE 'LICENSE.txt')" `
            "/DCIRCULATE_VERSION=$env:FULL_VERSION" `
            (Join-Path $env:GITHUB_WORKSPACE "packaging\windows-installer.nsi")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $outFile)) { throw "NSIS did not create $outFile" }
          Get-Item -LiteralPath $outFile | Select-Object FullName, Length

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Circulate-Windows-VST3-Setup-${{ steps.release.outputs.version }}
          path: outputs/Circulate-Windows-VST3-Setup-${{ steps.release.outputs.version }}.exe
          if-no-files-found: error

      - name: Create or update Windows GitHub Release
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $asset = Join-Path $env:GITHUB_WORKSPACE "outputs\Circulate-Windows-VST3-Setup-$env:VERSION.exe"
          gh release view $env:TAG --repo $env:REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $asset --repo $env:REPOSITORY --clobber
          } else {
            gh release create $env:TAG $asset `
              --repo $env:REPOSITORY `
              --title "Circulate Windows $env:VERSION" `
              --notes "Circulate Windows VST3 installer $env:VERSION. Built from the macOS fork source with the same DSP, editor defaults, Depth keyframe switching, and Shift fine-adjustment changes."
          }
